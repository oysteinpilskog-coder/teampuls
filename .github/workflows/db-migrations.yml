# ============================================================
# Auto-push Supabase migrations on merge to main.
#
# Triggers when supabase/migrations/** changes land on main.
# Uses the official Supabase CLI to apply any new migrations to
# the production project — so we never again ship code that
# references a column the prod DB doesn't have (PGRST204).
#
# Required GitHub repository secrets (set under Settings →
# Secrets and variables → Actions):
#
#   SUPABASE_ACCESS_TOKEN   Personal access token from
#                           https://supabase.com/dashboard/account/tokens
#
#   SUPABASE_DB_PASSWORD    Database password for the project
#                           (Project Settings → Database → "Database password")
#
#   SUPABASE_PROJECT_REF    Project ref string. For TeamPulse:
#                           tcfmdfuenuhmkpbqzgsy
#
# The workflow is concurrent-safe (single-flight per branch) so a
# rapid succession of merges queues rather than racing.
# ============================================================

name: db-migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-migrations.yml'
  workflow_dispatch: # manual trigger from the Actions tab

concurrency:
  group: db-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push:
    name: supabase db push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Sanity-checks the DB-password secret BEFORE we hand it to the CLI
      # (which masks all output). Catches the most common mistakes — empty
      # value, accidental newline, or someone pasting an access-token /
      # service-role key (both are JWTs ~200+ chars and start with "eyJ")
      # instead of the actual postgres password.
      - name: Sanity-check secrets
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "${SUPABASE_DB_PASSWORD}" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is empty."
            exit 1
          fi
          LEN=${#SUPABASE_DB_PASSWORD}
          echo "Password length: ${LEN} characters"
          # Trailing newline / CR check — GitHub's secret UI strips most
          # whitespace but a paste with a hard return can sneak through.
          case "${SUPABASE_DB_PASSWORD}" in
            *$'\n'*) echo "::error::Password contains a newline. Re-paste without trailing return." ; exit 1 ;;
            *$'\r'*) echo "::error::Password contains a CR. Re-paste without trailing return." ; exit 1 ;;
            ' '*|*' ') echo "::error::Password has leading/trailing space." ; exit 1 ;;
          esac
          # JWT shape: dot-separated three segments, base64-ish, starts with eyJ
          case "${SUPABASE_DB_PASSWORD}" in
            eyJ*.*.*)
              echo "::error::SUPABASE_DB_PASSWORD looks like a JWT (anon-key / service-role-key / access-token)."
              echo "::error::Use the postgres database password instead: Project Settings → Database → Reset database password."
              exit 1 ;;
          esac

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --debug

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db push --include-all --debug
